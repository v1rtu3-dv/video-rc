<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RC Car FPV Teleoperation</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; display: none; }
        .feed-card { background: #1e1e1e; border-radius: 12px; padding: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .feed-card img { width: 100%; height: auto; border-radius: 8px; display: block; background: #000; }
        .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; justify-content: center; margin: 20px 0; }
        .btn { width: 70px; height: 70px; font-size: 22px; font-weight: bold; background: #2a2a2a; color: white; border: 2px solid #444; border-radius: 8px; cursor: pointer; user-select: none; }
        .btn:active, .btn.active { background: #007aff; border-color: #0056b3; }
        .audio-btn { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #27ae60; color: white; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 15px; }
        .audio-btn.active { background: #c0392b; }
        .status { font-size: 14px; color: #aaa; margin-top: 10px; }
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #121212; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .auth-card { background: #1e1e1e; padding: 30px; border-radius: 12px; border: 1px solid #333; width: 300px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .auth-card h2 { margin-top: 0; color: #fff; }
        .auth-card input { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; box-sizing: border-box; }
        .auth-card button { width: 100%; padding: 10px; margin-top: 12px; border-radius: 6px; border: none; background: #007aff; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
        .auth-card button:hover { background: #0056b3; }
        .auth-error { color: #e74c3c; font-size: 13px; margin-top: 10px; min-height: 18px; }
        .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logout-btn { background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h2>RC FPV Login</h2>
            <input type="email" id="email-input" placeholder="Email" autocomplete="email">
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password">
            <button id="login-btn">Sign In</button>
            <div id="auth-error" class="auth-error"></div>
        </div>
    </div>

    <div class="container" id="app-container">
        <div class="user-header">
            <span id="user-email-display" class="status">Logged in</span>
            <button id="logout-btn" class="logout-btn">Sign Out</button>
        </div>

        <h1>RC Car Teleoperation</h1>

        <button id="enable-audio-btn" class="audio-btn">Enable Live Audio Stream</button>

        <div class="feed-card">
            <img id="video-feed" alt="Live FPV Video Feed">
        </div>

        <p class="status" id="ws-status">Connecting to car...</p>

        <div class="controls">
            <div></div><button class="btn" id="btn-w">W</button><div></div>
            <button class="btn" id="btn-a">A</button><button class="btn" id="btn-s">S</button><button class="btn" id="btn-d">D</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBX2ybnshzC8rdm2M7RIrU77jva1KqfR3Y",
            authDomain: "levislawns.firebaseapp.com",
            projectId: "levislawns",
            storageBucket: "levislawns.firebasestorage.app",
            messagingSenderId: "514611346211",
            appId: "1:514611346211:web:61b1d48bae07b1f528aa96"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let ws = null;
        let audioCtx = null;
        let micStream = null;
        let scriptProcessor = null;
        let nextAudioTime = 0;
        let audioEnabled = false;
        const activeKeys = new Set();

        const authOverlay = document.getElementById('auth-overlay');
        const appContainer = document.getElementById('app-container');
        const emailInput = document.getElementById('email-input');
        const passwordInput = document.getElementById('password-input');
        const loginBtn = document.getElementById('login-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const audioBtn = document.getElementById('enable-audio-btn');
        const authError = document.getElementById('auth-error');
        const userEmailDisplay = document.getElementById('user-email-display');
        const videoFeed = document.getElementById('video-feed');
        const statusText = document.getElementById('ws-status');

        loginBtn.addEventListener('click', async () => {
            authError.innerText = '';
            try {
                await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
            } catch (error) {
                authError.innerText = "Invalid credentials.";
            }
        });

        logoutBtn.addEventListener('click', () => {
            stopMic();
            signOut(auth);
        });

        audioBtn.addEventListener('click', async () => {
            try {
                if (!audioCtx) {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContextClass) {
                        alert("Web Audio API is not supported in this browser.");
                        return;
                    }
                    audioCtx = new AudioContextClass({ sampleRate: 16000 });
                }
                
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                if (!audioEnabled) {
                    await startMicPCM();
                    audioEnabled = true;
                    audioBtn.innerText = "Disable Live Audio Stream";
                    audioBtn.classList.add('active');
                } else {
                    stopMic();
                    audioEnabled = false;
                    audioBtn.innerText = "Enable Live Audio Stream";
                    audioBtn.classList.remove('active');
                }
            } catch (err) {
                console.error("Audio initialization error:", err);
                alert("Audio Error: " + err.message);
            }
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                authOverlay.style.display = 'none';
                appContainer.style.display = 'block';
                userEmailDisplay.innerText = `User: ${user.email}`;
                initWebSocket();
            } else {
                authOverlay.style.display = 'flex';
                appContainer.style.display = 'none';
                videoFeed.src = "";
                if (ws) ws.close();
            }
        });

        function initWebSocket() {
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
            ws.binaryType = "arraybuffer";

            ws.onopen = () => { 
                statusText.innerText = 'Connected (30 FPS Paced Stream)'; 
                statusText.style.color = '#2ecc71';
            };

            ws.onmessage = (event) => {
                if (typeof event.data === "string") {
                    // Safe JSON parsing for structured video frames
                    const msg = JSON.parse(event.data);
                    if (msg.type === "video") {
                        videoFeed.src = "data:image/jpeg;base64," + msg.data;
                    }
                } else if (event.data instanceof ArrayBuffer) {
                    // Dedicated binary blocks for audio only
                    playPcmAudio(event.data);
                }
            };

            ws.onclose = () => { 
                statusText.innerText = 'Disconnected'; 
                statusText.style.color = '#e74c3c'; 
                stopMic();
            };
        }

        function playPcmAudio(arrayBuffer) {
            if (!audioCtx || !audioEnabled) return;

            const pcm16 = new Int16Array(arrayBuffer);
            if (pcm16.length === 0) return;

            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32[i] = pcm16[i] / 32768.0;
            }

            const buffer = audioCtx.createBuffer(1, float32.length, 16000);
            buffer.getChannelData(0).set(float32);

            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);

            const now = audioCtx.currentTime;
            if (nextAudioTime < now) nextAudioTime = now + 0.005;
            source.start(nextAudioTime);
            nextAudioTime += buffer.duration;
        }

        async function startMicPCM() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                alert("Microphone access requires HTTPS or localhost.");
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        sampleRate: 16000, 
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });

                const micSource = audioCtx.createMediaStreamSource(micStream);
                scriptProcessor = audioCtx.createScriptProcessor(256, 1, 1);

                scriptProcessor.onaudioprocess = (e) => {
                    if (ws && ws.readyState === WebSocket.OPEN && audioEnabled) {
                        const inputData = e.inputBuffer.getChannelData(0);
                        const pcm16 = new Int16Array(inputData.length);
                        for (let i = 0; i < inputData.length; i++) {
                            pcm16[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                        }
                        ws.send(pcm16.buffer);
                    }
                };

                micSource.connect(scriptProcessor);
                scriptProcessor.connect(audioCtx.destination);
            } catch (err) {
                console.error("Mic error:", err);
                alert("Could not access microphone: " + err.message);
            }
        }

        function stopMic() {
            if (scriptProcessor) scriptProcessor.disconnect();
            if (micStream) micStream.getTracks().forEach(t => t.stop());
        }

        window.addEventListener('keydown', (e) => {
            if (auth.currentUser === null || !e.key) return;
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key) && !activeKeys.has(key)) {
                activeKeys.add(key);
                document.getElementById(`btn-${key}`)?.classList.add('active');
                sendDriveCommand();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (auth.currentUser === null || !e.key) return;
            const key = e.key.toLowerCase();
            if (['w', 'a', 's', 'd'].includes(key)) {
                activeKeys.delete(key);
                document.getElementById(`btn-${key}`)?.classList.remove('active');
                sendDriveCommand();
            }
        });

        function sendDriveCommand() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const command = Array.from(activeKeys).join('') || 'stop';
                ws.send(JSON.stringify({ type: 'drive', command: command }));
            }
        }
    </script>
</body>
</html>
